[package]
name = "ai-call-qa-cockpit"
version = "1.0.0"
description = "AI Call QA Cockpit"
authors = ["Codex"]
edition = "2021"

[lib]
name = "ai_call_qa_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
